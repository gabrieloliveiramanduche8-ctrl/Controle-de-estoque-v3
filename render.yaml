services:
  - type: web
    name: controle-cortes-fardos-v6
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: controle-cortes-fardos-db
          property: connectionString

databases:
  - name: controle-cortes-fardos-db
    plan: free
